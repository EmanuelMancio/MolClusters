version: 2

updates:
  # Python dependencies in uv.lock, including the dev tools the pre-commit hooks run
  # (ruff, reuse, commitizen, pytest).
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dev-tools:
        dependency-type: "development"
      runtime:
        dependency-type: "production"

  # The container image's base images (python, uv) in Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      images:
        patterns: ["*"]
    # The image stays on Python 3.13: take only digest and patch updates of its tag, never
    # a move to a newer Python (3.15 is only tested in CI, without a support claim).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
