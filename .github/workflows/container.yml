# Builds the container image (Dockerfile; linux/amd64 only) and runs it on a test
# system, as the Release workflow does before publishing it. It runs only when a file
# that can break the image changes (code changes are covered by the Tests workflow), or
# by hand.

name: Container

on:
  push:
    branches: [main, dev]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - scripts/check_container.sh
      - .github/workflows/container.yml
  pull_request:
    branches: [main, dev]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - scripts/check_container.sh
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: molclusters:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        run: scripts/check_container.sh molclusters:test
