# Releases a version tag pushed by `cz bump` (see the developer guide's "Commits and
# releases"): checks the tag matches the package version, runs the tests and builds the
# package once, uploads it to PyPI, pushes the container image (an OCI image for
# linux/amd64 and linux/arm64) to ghcr.io, then publishes the GitHub release with the
# same files and the version's CHANGELOG.md section as notes. Zenodo archives each
# published GitHub release and gives it a DOI.
#
# PyPI uses trusted publishing (no token): the PyPI project must list this repository,
# this workflow (release.yml) and the `pypi` environment as a trusted publisher. The
# image is pushed with the workflow's own token (`packages: write`).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match pyproject.toml's version $version."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

      - name: Build the package
        run: uv build

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v head="## $TAG " 'index($0, head) == 1 { found = 1; next }
                                  found && /^## / { exit }
                                  found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $TAG ' section."
            exit 1
          fi
          echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}\`." >> notes.md
          echo >> notes.md
          echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for every version." >> notes.md

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Keep the release notes
        uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/molclusters/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Get the package
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3

  # The image is built from the tagged sources and uv.lock (Dockerfile), tested on
  # linux/amd64, then built for both platforms and pushed as an OCI image index (OCI
  # media types, org.opencontainers.image.* labels and annotations) tagged X.Y.Z, X.Y
  # and latest.
  container:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU (to build for linux/arm64)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Name, tag and annotate the image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=MolClusters
            org.opencontainers.image.licenses=LGPL-3.0-or-later
            org.opencontainers.image.documentation=https://emanuelmancio.github.io/MolClusters/
          annotations: |
            org.opencontainers.image.title=MolClusters
            org.opencontainers.image.licenses=LGPL-3.0-or-later
            org.opencontainers.image.documentation=https://emanuelmancio.github.io/MolClusters/
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build the image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: molclusters:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        run: scripts/check_container.sh molclusters:test "${TAG#v}"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=registry,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha

  github-release:
    needs: [pypi, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the package
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Get the release notes
        uses: actions/download-artifact@v8
        with:
          name: notes

      - name: Publish the release
        run: >-
          gh release create "$TAG" dist/*
          --repo "${{ github.repository }}" --verify-tag --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
