name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The pre-commit hooks' checks, for pull requests from contributors who don't run them.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      # ruff check, ruff format and reuse lint-file; pytest runs in its own job below.
      - name: Run the pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: pytest

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov's tokenless upload authenticates with a GitHub OIDC token.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      # Coverage is reported (and held at 95% or more) from the 3.12 job only. The floor is
      # here rather than in .coveragerc so that running part of the suite locally still passes.
      - name: Run tests
        run: uv run pytest ${{ matrix.python-version == '3.12' && '--cov-report=term-missing --cov-report=xml --cov-fail-under=95' || '' }}

      # Feeds the README's coverage badge. A failed upload (e.g. a fork's pull request, which
      # gets no OIDC token) doesn't fail the job.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          use_oidc: true
