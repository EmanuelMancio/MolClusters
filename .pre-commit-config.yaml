# Every hook runs the tool installed by uv, so versions are pinned in uv.lock
# (updated by Dependabot) and always match `uv run <tool>`; no autoupdate needed.

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        stages: [pre-commit]

      - id: reuse-lint-file
        name: reuse lint-file
        entry: uv run reuse lint-file
        language: system
        stages: [pre-commit]

      # Only the tests affected by what changed since the last run (pytest-testmon, which
      # needs coverage off, and doesn't see data files); pytest-all runs them all on push.
      - id: pytest
        name: pytest (affected tests)
        entry: uv run pytest --testmon --no-cov -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # The whole suite before a push; coverage is left to CI.
      - id: pytest-all
        name: pytest (all tests)
        entry: uv run pytest --no-cov -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: commitizen
        name: conventional commit message
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
