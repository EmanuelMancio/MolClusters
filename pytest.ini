[pytest]
addopts = -rA --show-capture=stderr --import-mode=importlib --cov=src --cov-report html
testpaths = tests
# tests/data/met-mal/start.pdb is a single frame with no timestep, so MDAnalysis falls
# back to dt = 1 ps; no test depends on those times
filterwarnings =
    ignore:Reader has no dt information:UserWarning
