[project]
name = "MolClusters"
version = "0.7.0"
description = "Tool to analyze cluster formation in molecular dynamics simulations"
authors = [{ name = "Emanuel Mancio", email = "emanuelmancio@usp.br" }]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "LICENSES/*.txt"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy>=2.2.4,<3.0.0",
    "networkx>=3.4.2,<4.0.0",
    "mdanalysis[analysis]>=2.10.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "pandas>=2.2.3,<4.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "loguru>=0.7.3,<0.8.0",
    "biopython>1.86",
    "orjson>=3.11.0,<4.0.0",
    "zstandard>=0.25.0,<1.0.0",
]
keywords = ["molecular dynamics", "clusters", "nucleation", "MDAnalysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
homepage = "https://emanuelmancio.github.io/MolClusters/"
documentation = "https://emanuelmancio.github.io/MolClusters/"
repository = "https://github.com/EmanuelMancio/MolClusters"
issues = "https://github.com/EmanuelMancio/MolClusters/issues"
changelog = "https://github.com/EmanuelMancio/MolClusters/blob/main/CHANGELOG.md"

[project.scripts]
molclusters = "molclusters.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.16.8,<0.17.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "commitizen>=4.5.1,<5.0.0",
    "reuse>=6.0.0,<7.0.0",
]
docs = [
    "mike>=2.1.3,<3.0.0",
    "mkdocs-material>=9.7.7,<10.0.0",
    "mkdocstrings[python]>=1.0.6,<2.0.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver2"
update_changelog_on_bump = true
gpg_sign = true
annotated_tag = true
bump_message = "chore: release v$current_version -> v$new_version"
changelog_incremental = true
major_version_zero = true
tag_format = "v$version"
pre_bump_hooks = [
    "uv run python scripts/check_release_branch.py",
    "uv lock",
    "uv run python scripts/update_citation.py",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
