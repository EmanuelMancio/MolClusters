[project]
name = "MolClusters"
version = "0.3.1"
description = "Tool to analyze cluster formation in molecular dynamics simulations"
authors = [{ name = "Emanuel Mancio", email = "emanuelmancio@usp.br" }]
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYING", "LICENSES/*.txt"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "numpy (>=2.2.4,<3.0.0)",
    "networkx (>=3.4.2,<4.0.0)",
    "mdanalysis[analysis] (>=2.9.0,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Private :: Do Not Upload",
]

[project.urls]
repository = "https://github.com/EmanuelMancio/MolClusters"

[project.scripts]
molclusters = "molclusters.main:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "molclusters", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
ruff = "^0.11.4"
pytest-cov = "^5.0.0"
pre-commit = "^4.2.0"
commitizen = "^4.5.1"
reuse = "^5.0.2"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=src --cov-report html"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver2"
update_changelog_on_bump = true
gpg_sign = true
annotated_tag = true
bump_message = "chore: release $current_version -> $new_version [skip-ci]"
changelog_incremental = true
major_version_zero = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
